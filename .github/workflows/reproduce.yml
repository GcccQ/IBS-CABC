name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt -c requirements-constraints.txt -e ./cssd-kg-edr -e ./cssd-comparison-baselines -e ./cssd-dbd-case-study -e ./kraul-dbd-reproduction
      - run: python -m pip check
      - run: python tools/check_publication_scope.py
      - run: python tools/verify_files.py
      - run: python tools/prepare_data.py
      - run: python tools/prepare_results.py
      - run: python tools/check_delivery.py --tests
      - run: python tools/run_experiment.py --experiment fixed --smoke
      - run: python tools/run_experiment.py --experiment dbd-three --smoke
      - run: python tools/run_experiment.py --experiment dbd-kraul --smoke
      - run: python tools/rebuild_saved.py --target all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-${{ matrix.os }}
          path: reruns/delivery_checks/
