# Local health check only: 8 fixed instances and 5% of the paper time formula.
# Never merge these results into the formal E1-E6 evidence.
experiment:
  name: local_precheck
  report_template: precheck
  selection:
    split: data/splits/local_precheck.txt
  protocols:
    - {name: precheck_5pct_paper_time, mode: official_time, tau: 0.05}
  seeds: [101]
  evidence_contract:
    instances: 8
    scenarios: 1
    algorithm_labels: 1
  algorithms:
    - name: ibscabc
      parameters:
        assignment_repair_workers: 1
