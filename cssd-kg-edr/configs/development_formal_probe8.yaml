# Development-only budget-scaling probe. The per-instance budget matches the
# paper, but eight stratified instances are not the complete Table 5 sample.
experiment:
  name: development_formal_probe8
  report_template: precheck
  selection:
    split: data/splits/development_formal_probe8.txt
  protocols:
    - {name: paper_time_tau1, mode: official_time, tau: 1.0}
  seeds: [101]
  evidence_contract:
    instances: 8
    scenarios: 1
    algorithm_labels: 1
  algorithms:
    - name: ibscabc
      parameters:
        assignment_repair_workers: 1
