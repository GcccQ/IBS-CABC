[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cssd-ibscabc"
version = "1.2.0"
description = "Paper-aligned IBS-CABC experiments for two-stage CSSD batch scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "ortools>=9.10,<10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cssd-ibscabc = "cssd_ibscabc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
