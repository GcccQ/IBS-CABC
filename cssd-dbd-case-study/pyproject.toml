[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cssd-dbd-case-study"
version = "1.0.0"
description = "Isolated day-by-day CSSD case-study runner for IBS-CABC, ALNS and TS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "ortools>=9.10,<10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cssd-dbd-run = "cssd_dbd_case.runner:main"
cssd-dbd-report = "cssd_dbd_case.reporting:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
