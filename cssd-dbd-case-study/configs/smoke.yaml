experiment:
  name: dbd_case_smoke
  contract: development
  data_root: ../dataset
  split: data/smoke_two_days.txt
  expected_days: 2
  expected_jobs: 664
  first_day_seed: 233
  last_day_seed: 234
  machines_stage1: 12
  machines_stage2: 5
  day_length_minutes: 1440
  seeds: [7]
  workers: 1
  protocol:
    name: smoke_e12
    mode: evaluations
    max_evaluations: 12
  algorithms:
    - name: ibscabc
      label: IBS-CABC
      parameters:
        colony_size: 4
        abandonment_limit: 2
        archive_size: 4
        operator_attempts: 1
        ejection_depth: 2
        intensification_enabled: true
        intensification_fraction: 0.90
        intensification_max_evaluations: 20
        intensification_critical_batches: 2
        assignment_repair_enabled: false
        assignment_repair_seconds_per_family: 0.1
        assignment_repair_workers: 1
        assignment_repair_iterations: 1
        assignment_repair_joint_max_jobs: 600
        assignment_repair_max_jobs: 600
        assignment_repair_allow_empty_batches: true
        assignment_repair_time_fraction: 0.0
        mathematical_repair_seconds: 1.0
        onlooker_quality_weight: 0.60
        onlooker_diversity_weight: 0.15
        onlooker_bottleneck_weight: 0.25
        delta_seed_pairs:
          - [1.00, 1.00]
          - [0.93, 1.00]
          - [1.00, 0.95]
          - [0.67, 0.78]
        bottleneck_aware: true
    - name: alns
      label: ALNS
      parameters:
        population_size: 4
        stagnation_limit: 2
        candidate_attempts: 1
        cache_capacity: 16
        delta_seed_pairs:
          - [1.00, 1.00]
          - [0.93, 1.00]
          - [1.00, 0.95]
          - [0.67, 0.78]
        reaction_factor: 0.20
        initial_temperature_ratio: 0.01
        final_temperature_ratio: 0.00001
    - name: ts
      label: TS
      parameters:
        population_size: 4
        stagnation_limit: 2
        candidate_attempts: 1
        cache_capacity: 16
        delta_seed_pairs:
          - [1.00, 1.00]
          - [0.93, 1.00]
          - [1.00, 0.95]
          - [0.67, 0.78]
        neighborhood_size: 3
        tabu_tenure: 2
