[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kraul-dbd-reproduction"
version = "1.1.0"
description = "Isolated DBD and fixed-scale reproduction of Kraul et al.'s algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
analysis = ["scipy>=1.10"]

[project.scripts]
kraul-dbd-run = "kraul_dbd_reproduction.runner:main"
kraul-dbd-report = "kraul_dbd_reproduction.reporting:main"
kraul-dbd-validate-paper = "kraul_dbd_reproduction.paper_validation:main"
kraul-fixed-run = "kraul_dbd_reproduction.fixed_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
